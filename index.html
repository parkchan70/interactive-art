<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인천과학대제전 · 인공지능창작교실</title>
<style>
  :root{
    --ui-bg: rgba(12,14,20,.55);
    --ui-line: rgba(255,255,255,.18);
    --ui-text: #fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#05070c;overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ui-text);-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

  /* ---------- 타이틀 ---------- */
  #title{
    position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);text-align:center;pointer-events:none;z-index:5;
    text-shadow:0 2px 18px rgba(0,0,0,.75), 0 0 46px rgba(0,0,0,.5);
    animation:fadeDown 1.4s ease both;
  }
  #title .sub{font-size:clamp(11px,1.5vw,15px);letter-spacing:.42em;
    opacity:.82;font-weight:500;margin-bottom:.5em;padding-left:.42em;}
  #title .main{font-size:clamp(17px,2.7vw,34px);font-weight:800;letter-spacing:.04em;white-space:nowrap;}
  #title .rule{width:56px;height:1px;margin:.85em auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);}
  @keyframes fadeDown{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- 배경 선택 ---------- */
  #themes{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:max(20px,env(safe-area-inset-bottom));z-index:6;
    display:flex;gap:12px;padding:12px;border-radius:20px;
    background:var(--ui-bg);border:1px solid var(--ui-line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .35s, transform .35s;
    max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
  }
  #themes::-webkit-scrollbar{display:none;}
  .card{
    position:relative;flex:0 0 auto;width:132px;border:0;padding:0;cursor:pointer;
    background:transparent;color:inherit;border-radius:13px;overflow:hidden;
    outline:2px solid transparent;outline-offset:2px;transition:transform .22s, outline-color .22s;
  }
  .card:hover{transform:translateY(-4px);}
  .card.on{outline-color:rgba(255,255,255,.92);}
  .card canvas{position:static;width:132px;height:76px;border-radius:13px;}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;
    font-size:12.5px;font-weight:700;letter-spacing:.02em;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.82));text-shadow:0 1px 4px #000;}

  /* ---------- 컨트롤 패널 ---------- */
  #panel{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:6;
    width:236px;padding:16px;border-radius:18px;
    background:var(--ui-bg);border:1px solid var(--ui-line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .35s, transform .35s;
  }
  #panel h2{margin:0 0 12px;font-size:12px;letter-spacing:.2em;opacity:.65;font-weight:600;}
  .row{margin-bottom:13px;}
  .row label{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:6px;}
  .row input[type=range]{width:100%;accent-color:#fff;}
  .btns{display:flex;gap:7px;flex-wrap:wrap;}
  .btn{flex:1 1 auto;padding:9px 8px;font-size:12px;font-weight:600;cursor:pointer;
    color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--ui-line);
    border-radius:10px;transition:background .2s;font-family:inherit;}
  .btn:hover{background:rgba(255,255,255,.22);}
  .btn.on{background:rgba(255,255,255,.85);color:#111;}
  #hint{margin-top:12px;font-size:11px;line-height:1.65;opacity:.55;}
  #status{margin-top:10px;font-size:11px;opacity:.75;min-height:1.4em;}

  .hidden-ui #themes,.hidden-ui #panel{opacity:0;transform:translateY(20px);pointer-events:none;}
  .hidden-ui #panel{transform:translate(30px,-50%);}

  /* ---------- 시작 화면 ---------- */
  #intro{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 45%,#1b2338 0%,#05070c 72%);
    transition:opacity .7s;
  }
  #intro.gone{opacity:0;pointer-events:none;}
  #intro h1{margin:0;font-size:clamp(24px,4.6vw,50px);font-weight:800;letter-spacing:.04em;}
  #intro .kicker{font-size:clamp(11px,1.6vw,15px);letter-spacing:.46em;opacity:.7;padding-left:.46em;}
  #intro p{margin:0;max-width:34em;font-size:14px;line-height:1.85;opacity:.72;}
  #intro .go{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .cta{padding:15px 30px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:inherit;border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.94);color:#12151d;transition:transform .2s, box-shadow .2s;}
  .cta.ghost{background:transparent;color:#fff;}
  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.45);}
  #introNote{font-size:12px;opacity:.5;min-height:1.4em;}
  @media (max-width:820px){
    #panel{top:auto;bottom:126px;right:12px;transform:none;width:196px;padding:13px;}
    #panel.hidden-ui,.hidden-ui #panel{transform:translateY(24px);}
    #hint{display:none;}
    .card{width:104px;} .card canvas{width:104px;height:62px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
  <video id="cam" playsinline muted autoplay></video>

  <div id="title">
    <div class="sub">INCHEON SCIENCE FESTIVAL</div>
    <div class="main">인천과학대제전 · 인공지능창작교실</div>
    <div class="rule"></div>
  </div>

  <div id="themes"></div>

  <div id="panel">
    <h2>CONTROL</h2>
    <div class="row">
      <label><span>사람 인식 감도</span><b id="vSens"></b></label>
      <input id="sens" type="range" min="8" max="60" value="24">
    </div>
    <div class="row">
      <label><span>입자 수</span><b id="vCount"></b></label>
      <input id="count" type="range" min="200" max="2600" step="50" value="1100">
    </div>
    <div class="row">
      <label><span>바람 세기</span><b id="vWind"></b></label>
      <input id="wind" type="range" min="0" max="200" value="100">
    </div>
    <div class="btns">
      <button class="btn" id="btnReset">배경 재설정</button>
      <button class="btn on" id="btnMirror">거울</button>
      <button class="btn" id="btnSil">실루엣</button>
      <button class="btn" id="btnFull">전체화면</button>
    </div>
    <div id="status"></div>
    <div id="hint">단축키 · <b>1~3</b> 배경 전환 · <b>R</b> 배경 재설정 · <b>H</b> 화면 정리 · <b>F</b> 전체화면</div>
  </div>

  <div id="intro">
    <div class="kicker">INCHEON SCIENCE FESTIVAL</div>
    <h1>인천과학대제전 · 인공지능창작교실</h1>
    <p>배경을 고르고 카메라 앞에 서 보세요.<br>
       컴퓨터가 여러분의 움직임을 알아보고, 꽃잎 같은 빛의 입자가 몸을 따라 흩날립니다.</p>
    <div class="go">
      <button class="cta" id="btnStart">카메라 켜고 시작하기</button>
      <button class="cta ghost" id="btnDemo">카메라 없이 체험</button>
    </div>
    <div id="introNote">시작 후 3초간 카메라 앞을 비워 두면 인식이 정확해집니다.</div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   인천과학대제전 · 인공지능창작교실  —  Interactive Petal Art
   웹캠 배경차분으로 사람 실루엣을 찾고, 그 실루엣을 힘의 장으로 바꾸어
   꽃잎 입자를 흩날리게 하는 단일 파일 인터랙티브 아트.
   ========================================================================= */

/* ---------- 유틸 ---------- */
const rnd  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(seed){            // 배경을 매번 똑같이 그리기 위한 고정 난수
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 배경(테마) 정의 ---------- */
const THEMES = [
  {
    id:'chrys', name:'국화 꽃밭',
    colors:['#fffdf0','#ffefa8','#ffd645','#ffc16b'],
    shape:'petal', blend:'source-over',
    glow:[255,236,150], glowAmt:0.42,
    gravity:16, wind:26, swirl:1.0, drag:0.986, size:[11,24], burst:150,
    paint(g, W, H){
      const r = mulberry32(7);
      let sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#f3e6b0'); sky.addColorStop(.42,'#e9dc96');
      sky.addColorStop(.62,'#c8d182'); sky.addColorStop(1, '#5f7132');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      // 낮은 해의 빛무리
      let sun = g.createRadialGradient(W*.72, H*.2, 0, W*.72, H*.2, H*.7);
      sun.addColorStop(0,'rgba(255,250,205,.85)'); sun.addColorStop(1,'rgba(255,250,205,0)');
      g.fillStyle = sun; g.fillRect(0, 0, W, H);
      // 겹치는 언덕
      const hills = [[.52,'#9aa85c'],[.63,'#7f9049'],[.76,'#65763a'],[.9,'#4a5a2b']];
      for (const [y, c] of hills){
        g.fillStyle = c; g.beginPath(); g.moveTo(0, H);
        for (let x = 0; x <= W; x += 24){
          const n = Math.sin(x*.004 + y*40)*H*.035 + Math.sin(x*.011 + y*13)*H*.018;
          g.lineTo(x, H*y + n);
        }
        g.lineTo(W, H); g.closePath(); g.fill();
      }
      // 국화 무리 — 아래로 갈수록 크고 흐릿하게(피사계 심도)
      for (let i = 0; i < 1400; i++){
        const d = r(), y = H*(.5 + d*.55), s = 1.5 + d*d*8.5;
        g.globalAlpha = .2 + d*.45;
        g.fillStyle = ['#fff4c4','#ffe57a','#ffd33f','#fff8de'][(r()*4)|0];
        g.beginPath(); g.arc(r()*W, y, s, 0, 6.284); g.fill();
      }
      g.globalAlpha = 1;
    },
    over(g, W, H, t){    // 천천히 흔들리는 햇살
      g.globalAlpha = .06 + .03 * Math.sin(t * .0006);
      let s = g.createRadialGradient(W*.72, H*.2, 0, W*.72, H*.2, H*.55);
      s.addColorStop(0,'#fffbe0'); s.addColorStop(1,'rgba(255,251,224,0)');
      g.fillStyle = s; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
    }
  },
  {
    id:'sunset', name:'노을 지는 해변',
    colors:['#fff3d0','#ffc07a','#ff8a5c','#ff6f91'],
    shape:'spark', blend:'lighter',
    glow:[255,170,120], glowAmt:0.5,
    gravity:9, wind:34, swirl:1.25, drag:0.99, size:[6,15], burst:170,
    paint(g, W, H){
      const r = mulberry32(21), hz = H*.62;
      let sky = g.createLinearGradient(0, 0, 0, hz);
      sky.addColorStop(0,'#2b2456'); sky.addColorStop(.32,'#7d3f74');
      sky.addColorStop(.62,'#e0705f'); sky.addColorStop(.86,'#ffa25a');
      sky.addColorStop(1,'#ffd89b');
      g.fillStyle = sky; g.fillRect(0, 0, W, hz);
      // 구름 띠
      for (let i = 0; i < 26; i++){
        const y = r()*hz*.85, w = W*(.12 + r()*.4), h = H*(.006 + r()*.016);
        g.globalAlpha = .1 + r()*.22;
        g.fillStyle = y < hz*.45 ? '#ffc9d6' : '#ffe2b0';
        g.beginPath(); g.ellipse(r()*W, y, w, h, 0, 0, 6.284); g.fill();
      }
      g.globalAlpha = 1;
      // 해
      const sx = W*.5, sy = hz - H*.045, sr = H*.075;
      let halo = g.createRadialGradient(sx, sy, 0, sx, sy, sr*6);
      halo.addColorStop(0,'rgba(255,232,170,.9)'); halo.addColorStop(.25,'rgba(255,160,90,.42)');
      halo.addColorStop(1,'rgba(255,120,80,0)');
      g.fillStyle = halo; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff1c0'; g.beginPath(); g.arc(sx, sy, sr, 0, 6.284); g.fill();
      // 바다
      let sea = g.createLinearGradient(0, hz, 0, H);
      sea.addColorStop(0,'#c9705f'); sea.addColorStop(.35,'#6f4670');
      sea.addColorStop(1,'#241d3f');
      g.fillStyle = sea; g.fillRect(0, hz, W, H - hz);
      // 물 위 반사光
      for (let y = hz; y < H; y += 3){
        const d = (y - hz) / (H - hz);
        g.globalAlpha = (1 - d) * .5 * (.4 + r()*.6);
        const w = sr * (1.1 + d*7);
        g.fillStyle = '#ffd9a0';
        g.fillRect(sx - w/2 + (r()-.5)*w*.5, y, w*(.3 + r()*.7), 1.6);
      }
      g.globalAlpha = 1;
      // 젖은 모래
      let sand = g.createLinearGradient(0, H*.93, 0, H);
      sand.addColorStop(0,'rgba(60,42,58,0)'); sand.addColorStop(1,'rgba(30,22,34,.85)');
      g.fillStyle = sand; g.fillRect(0, H*.93, W, H*.07);
    },
    over(g, W, H, t){    // 반짝이는 윤슬
      const hz = H*.62, r = mulberry32((t*.002|0) + 3);
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 60; i++){
        const d = r(), y = hz + d*(H - hz);
        g.globalAlpha = (1 - d)*.5*r();
        g.fillStyle = '#ffe6b8';
        g.fillRect(W*.5 + (r()-.5)*W*(.08 + d*.9), y, 2 + r()*26, 1.5);
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
  },
  {
    id:'starry', name:'별이 빛나는 밤',
    colors:['#ffffff','#ffe9a8','#9ec9ff','#ffd45e'],
    shape:'star', blend:'lighter',
    glow:[150,190,255], glowAmt:0.6,
    gravity:4, wind:30, swirl:1.7, drag:0.992, size:[5,13], burst:200,
    paint(g, W, H){
      const r = mulberry32(1889);
      let sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0,'#0b1a4a'); sky.addColorStop(.45,'#123a86');
      sky.addColorStop(.78,'#1b4f9c'); sky.addColorStop(1,'#0a1330');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      // 고흐식 소용돌이 붓터치
      const swirl = (cx, cy, R, turns, col, lw) => {
        g.strokeStyle = col; g.lineCap = 'round';
        for (let k = 0; k < 5; k++){
          g.globalAlpha = .1 + r()*.22;
          g.lineWidth = lw*(.5 + r());
          g.beginPath();
          const off = r()*6.28, rad0 = R*(.12 + k*.13);
          for (let a = 0; a <= turns*6.283; a += .14){
            const rr = rad0 + a*R*.055;
            const x = cx + Math.cos(a + off)*rr*1.35, y = cy + Math.sin(a + off)*rr;
            a === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
          }
          g.stroke();
        }
      };
      swirl(W*.36, H*.26, H*.30, 2.2, '#cfe2ff', 7);
      swirl(W*.60, H*.34, H*.22, 1.9, '#a9c8ff', 6);
      swirl(W*.82, H*.16, H*.16, 1.6, '#ffe9a8', 5);
      // 흐르는 결
      for (let i = 0; i < 120; i++){
        g.globalAlpha = .05 + r()*.12; g.lineWidth = 1 + r()*5;
        g.strokeStyle = r() > .72 ? '#ffe9a8' : '#8fb6f5';
        g.beginPath();
        let x = r()*W, y = r()*H*.85;
        g.moveTo(x, y);
        for (let s = 0; s < 8; s++){
          x += 14 + r()*22; y += Math.sin(x*.01 + i)*9;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      g.globalAlpha = 1;
      // 별과 달
      const starAt = (x, y, R, c) => {
        let gr = g.createRadialGradient(x, y, 0, x, y, R);
        gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(.25, c);
        gr.addColorStop(1,'rgba(255,240,180,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 6.284); g.fill();
      };
      for (let i = 0; i < 15; i++) starAt(r()*W, r()*H*.7, H*(.02 + r()*.05), 'rgba(255,232,150,.55)');
      starAt(W*.88, H*.14, H*.13, 'rgba(255,220,120,.6)');
      // 사이프러스와 마을
      g.fillStyle = '#0a1020';
      g.beginPath(); g.moveTo(W*.06, H);
      for (let y = H; y > H*.02; y -= H*.05){
        const t2 = 1 - y/H, w = W*.085*(1 - t2*.92) + Math.sin(y*.05)*W*.012;
        g.lineTo(W*.09 - w, y);
      }
      for (let y = H*.02; y < H; y += H*.05){
        const t2 = 1 - y/H, w = W*.085*(1 - t2*.92) + Math.cos(y*.045)*W*.012;
        g.lineTo(W*.09 + w, y);
      }
      g.closePath(); g.fill();
      g.fillStyle = '#0c1428'; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += W/26){
        const h = H*(.86 + Math.sin(x*.02)*.035 + (r()>.7 ? -.05 : 0));
        g.lineTo(x, h); g.lineTo(x + W/26, h);
      }
      g.lineTo(W, H); g.closePath(); g.fill();
      for (let i = 0; i < 30; i++){    // 창문 불빛
        g.fillStyle = 'rgba(255,214,120,.85)';
        g.fillRect(r()*W, H*(.88 + r()*.1), 3, 4);
      }
    },
    over(g, W, H, t){    // 별의 맥동
      const r = mulberry32(1889);
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 15; i++){
        const x = r()*W, y = r()*H*.7, R = H*(.02 + r()*.05);
        g.globalAlpha = .12 + .12*Math.sin(t*.0016 + i*1.7);
        let gr = g.createRadialGradient(x, y, 0, x, y, R*1.7);
        gr.addColorStop(0,'rgba(255,246,205,.8)'); gr.addColorStop(1,'rgba(255,246,205,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, R*1.7, 0, 6.284); g.fill();
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
  }
];

/* ---------- 입자 스프라이트 (미리 그려두고 재사용) ---------- */
function makeSprite(color, shape){
  const S = 64, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.translate(S/2, S/2);
  if (shape === 'petal'){
    const grd = g.createLinearGradient(0, -30, 0, 30);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(.45, color); grd.addColorStop(1, color);
    g.filter = 'blur(1.4px)'; g.fillStyle = grd;
    g.beginPath(); g.ellipse(0, 0, 21, 30, 0, 0, 6.284); g.fill();
    g.filter = 'none'; g.globalAlpha = .3; g.strokeStyle = '#fff'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(0, -25); g.lineTo(0, 25); g.stroke();
  } else {
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, 30);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(.22, color);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(0, 0, 30, 0, 6.284); g.fill();
    if (shape === 'star'){
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 2; i++){
        g.rotate(Math.PI/2);
        const sp = g.createLinearGradient(-30, 0, 30, 0);
        sp.addColorStop(0,'rgba(255,255,255,0)'); sp.addColorStop(.5, color);
        sp.addColorStop(1,'rgba(255,255,255,0)');
        g.fillStyle = sp; g.fillRect(-30, -1.1, 60, 2.2);
      }
    }
  }
  return c;
}

/* ---------- 상태 ---------- */
const bgCv = document.getElementById('bg'), bgCtx = bgCv.getContext('2d');
const fxCv = document.getElementById('fx'), fxCtx = fxCv.getContext('2d');
const video = document.getElementById('cam');

let W = 0, H = 0, DPR = 1;
let theme = THEMES[0], sprites = [];
let bgStatic = document.createElement('canvas');

// 분석 해상도(저해상도일수록 빠르고 노이즈에 강함)
let AW = 160, AH = 120, GW = 80, GH = 60;
const aCv = document.createElement('canvas'), aCtx = aCv.getContext('2d', { willReadFrequently: true });
let bgModel = null, prevLum = null, field = null, fieldTmp = null, motion = null;
let calibrate = 0;                       // 남은 배경 학습 프레임 수

const glowCv = document.createElement('canvas'), glowCtx = glowCv.getContext('2d');

let particles = [];
let camOn = false, mirror = true, showSil = true, uiHidden = false;
let sens = 24, wantCount = 1100, windScale = 1;
let pointer = null;                      // 카메라 없을 때 마우스/터치 상호작용

/* ---------- 크기 조정 ---------- */
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bgCv, fxCv]){
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  }
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 화면 비율에 맞춰 분석 격자 비율도 맞춘다(좌표 왜곡 방지)
  AW = 160; AH = clamp(Math.round(AW * H / W), 90, 320);
  AW += AW % 2; AH += AH % 2;
  GW = AW >> 1; GH = AH >> 1;
  aCv.width = AW; aCv.height = AH;
  glowCv.width = GW; glowCv.height = GH;
  bgModel = new Float32Array(AW * AH);
  prevLum = new Float32Array(AW * AH);
  field    = new Float32Array(GW * GH);
  fieldTmp = new Float32Array(GW * GH);
  motion   = new Float32Array(GW * GH);
  calibrate = 45;

  paintBackground();
  buildParticles();
}

function paintBackground(){
  bgStatic.width = Math.round(W * DPR); bgStatic.height = Math.round(H * DPR);
  const g = bgStatic.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  theme.paint(g, W, H);
}

/* ---------- 입자 ---------- */
function spawn(p, fromTop){
  p.x = rnd(-0.1, 1.1) * W;
  p.y = fromTop ? rnd(-0.35, -0.02) * H : rnd(0, 1) * H;
  p.vx = rnd(-12, 12); p.vy = rnd(6, 30);
  p.s  = rnd(theme.size[0], theme.size[1]);
  p.rot = rnd(0, 6.28); p.vr = rnd(-1.6, 1.6);
  p.flip = rnd(0, 6.28); p.vf = rnd(.7, 2.4);
  p.sp = sprites[(Math.random() * sprites.length) | 0];
  p.a = rnd(.55, 1);
  p.ph = rnd(0, 6.28);
  return p;
}
function buildParticles(){
  sprites = theme.colors.map(c => makeSprite(c, theme.shape));
  const target = Math.round(wantCount * clamp((W * H) / (1280 * 720), .45, 1.7));
  particles = [];
  for (let i = 0; i < target; i++) particles.push(spawn({}, false));
}

/* ---------- 카메라 & 실루엣 검출 ---------- */
async function startCamera(){
  const s = await navigator.mediaDevices.getUserMedia({
    video: { width:{ideal:640}, height:{ideal:480}, facingMode:'user' }, audio: false
  });
  video.srcObject = s;
  await video.play();
  camOn = true; calibrate = 45;
}

function analyze(){
  if (!camOn || video.readyState < 2 || !video.videoWidth) return;

  // 화면 비율에 맞게 잘라서 분석 캔버스에 그린다
  const vw = video.videoWidth, vh = video.videoHeight, ar = AW / AH;
  let sw = vw, sh = vw / ar;
  if (sh > vh){ sh = vh; sw = vh * ar; }
  aCtx.save();
  if (mirror){ aCtx.translate(AW, 0); aCtx.scale(-1, 1); }
  aCtx.drawImage(video, (vw - sw)/2, (vh - sh)/2, sw, sh, 0, 0, AW, AH);
  aCtx.restore();

  const d = aCtx.getImageData(0, 0, AW, AH).data;
  const thr = sens, learning = calibrate > 0;
  if (learning) calibrate--;

  motion.fill(0); fieldTmp.fill(0);

  for (let y = 0, i = 0; y < AH; y++){
    for (let x = 0; x < AW; x++, i++){
      const o = i << 2;
      const lum = (d[o] * .299 + d[o+1] * .587 + d[o+2] * .114);
      const bg  = bgModel[i];
      let m = 0;
      if (learning){
        bgModel[i] = learning && calibrate > 40 ? lum : bg + (lum - bg) * .25;
      } else {
        const diff = Math.abs(lum - bg);
        m = clamp((diff - thr) / (thr * 1.6), 0, 1);
        // 사람이 없는 곳만 배경을 천천히 갱신(조명 변화 대응)
        bgModel[i] = bg + (lum - bg) * (m > .25 ? 0.0006 : 0.02);
      }
      const md = Math.abs(lum - prevLum[i]);
      prevLum[i] = lum;
      const gi = ((y >> 1) * GW) + (x >> 1);
      fieldTmp[gi] += m * .25;
      motion[gi]  += clamp((md - 6) / 30, 0, 1) * .25;
    }
  }

  // 부드럽게: 시간 평활 + 공간 블러
  for (let i = 0; i < field.length; i++)
    field[i] += (fieldTmp[i] - field[i]) * (fieldTmp[i] > field[i] ? .55 : .18);
  blur(field, 2);
  blur(motion, 1);
}

function blur(buf, passes){
  for (let p = 0; p < passes; p++){
    for (let y = 0; y < GH; y++){
      const r = y * GW;
      let prev = buf[r];
      for (let x = 0; x < GW; x++){
        const cur = buf[r + x], nxt = buf[r + Math.min(x + 1, GW - 1)];
        buf[r + x] = (prev + cur * 2 + nxt) * .25; prev = cur;
      }
    }
    for (let x = 0; x < GW; x++){
      let prev = buf[x];
      for (let y = 0; y < GH; y++){
        const cur = buf[y * GW + x], nxt = buf[Math.min(y + 1, GH - 1) * GW + x];
        buf[y * GW + x] = (prev + cur * 2 + nxt) * .25; prev = cur;
      }
    }
  }
}

/* 카메라가 없을 때: 포인터 위치를 사람 실루엣처럼 취급 */
function pointerField(){
  field.fill(0); motion.fill(0);
  if (!pointer) return;
  const cx = pointer.x / W * GW, cy = pointer.y / H * GH, R = GH * .28;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++){
    const dx = x - cx, dy = (y - cy) * 1.1;
    const v = clamp(1 - Math.hypot(dx, dy) / R, 0, 1);
    field[y * GW + x] = v * v;
    motion[y * GW + x] = v * pointer.speed;
  }
}

/* ---------- 렌더링 ---------- */
let last = performance.now(), fpsAvg = 60;

function frame(now){
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  fpsAvg += ((1 / Math.max(dt, .001)) - fpsAvg) * .05;

  camOn ? analyze() : pointerField();

  /* 배경 */
  bgCtx.setTransform(1, 0, 0, 1, 0, 0);
  bgCtx.drawImage(bgStatic, 0, 0);
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  theme.over(bgCtx, W, H, now);

  /* 실루엣 빛 */
  fxCtx.clearRect(0, 0, W, H);
  if (showSil){
    const img = glowCtx.createImageData(GW, GH), px = img.data;
    const [gr, gg, gb] = theme.glow;
    for (let i = 0; i < field.length; i++){
      const v = clamp(field[i] * 1.35, 0, 1);
      const o = i << 2;
      px[o] = gr; px[o+1] = gg; px[o+2] = gb;
      px[o+3] = (v * v * 235 * theme.glowAmt) | 0;
    }
    glowCtx.putImageData(img, 0, 0);
    fxCtx.save();
    fxCtx.globalCompositeOperation = 'lighter';
    fxCtx.imageSmoothingEnabled = true; fxCtx.imageSmoothingQuality = 'high';
    fxCtx.drawImage(glowCv, 0, 0, W, H);
    fxCtx.restore();
  }

  /* 입자 */
  const P = theme, gx = GW / W, gy = GH / H;
  const windT = Math.sin(now * .00035) * 0.6 + Math.sin(now * .00011) * 0.4;
  const F = dt * 60;                       // 60fps 기준 보정 계수

  fxCtx.save();
  fxCtx.globalCompositeOperation = P.blend;

  for (let k = 0; k < particles.length; k++){
    const p = particles[k];
    let cx = (p.x * gx) | 0, cy = (p.y * gy) | 0;
    cx = clamp(cx, 1, GW - 2); cy = clamp(cy, 1, GH - 2);
    const i = cy * GW + cx;

    // 실루엣 기울기 → 몸 바깥으로 밀어내는 힘
    const dx = field[i + 1] - field[i - 1];
    const dy = field[i + GW] - field[i - GW];
    const m  = motion[i], f = field[i];
    const push = (60 + m * 900) * P.swirl * F;
    p.vx -= dx * push;
    p.vy -= dy * push;
    // 움직임에 따른 소용돌이(기울기의 수직 성분)
    const sw = m * 460 * P.swirl * F;
    p.vx += -dy * sw;
    p.vy +=  dx * sw;
    // 몸 안쪽에 들어온 입자는 위로 띄운다
    if (f > .35) p.vy -= f * 32 * F;

    // 기본 운동: 중력 + 흔들리는 바람
    p.vy += P.gravity * dt * 8;
    p.vx += (windT * P.wind + Math.sin(now * .0012 + p.ph) * 14) * windScale * dt * 8;
    p.vx *= P.drag; p.vy *= P.drag;

    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt; p.flip += p.vf * dt;

    // 화면 밖이면 다시 위에서
    if (p.y > H + 60 || p.x < -120 || p.x > W + 120 || p.y < -H * .6){
      spawn(p, true); p.y = rnd(-0.25, -0.02) * H;
    }

    const petal = P.shape === 'petal';
    const sx = petal ? Math.max(Math.abs(Math.cos(p.flip)), .3) : 1;
    const hw = p.s * (petal ? .95 : 1.5) * sx, hh = p.s * (petal ? 1.7 : 1.5);
    fxCtx.save();
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.globalAlpha = p.a * clamp(.35 + m * 3.2 + f * .9, .35, 1);
    fxCtx.drawImage(p.sp, -hw * .5, -hh * .5, hw, hh);
    fxCtx.restore();
  }
  fxCtx.restore();

  emitBursts();
  requestAnimationFrame(frame);
}

/* 크게 움직인 자리에서 꽃잎이 터져 나오게 — 입자 총량은 유지 */
let burstCursor = 0;
function emitBursts(){
  if (!particles.length) return;
  let made = 0;
  for (let tries = 0; tries < 90 && made < 10; tries++){
    const i = (Math.random() * motion.length) | 0;
    if (motion[i] < .3 || field[i] < .18) continue;
    const p = particles[burstCursor = (burstCursor + 1) % particles.length];
    spawn(p, false);
    p.x = ((i % GW) + Math.random()) / GW * W;
    p.y = ((i / GW | 0) + Math.random()) / GH * H;
    const a = rnd(0, 6.283), sp = rnd(60, 260) * theme.burst / 150;
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 40;
    made++;
  }
}

/* ---------- UI ---------- */
const $ = s => document.querySelector(s);

function buildThemeCards(){
  const box = $('#themes');
  box.innerHTML = '';
  THEMES.forEach((t, idx) => {
    const b = document.createElement('button');
    b.className = 'card' + (t === theme ? ' on' : '');
    b.title = t.name;
    const c = document.createElement('canvas');
    const w = 264, h = 152;                       // 2배 해상도로 그려 축소
    c.width = w; c.height = h;
    t.paint(c.getContext('2d'), w, h);
    b.appendChild(c);
    const cap = document.createElement('div');
    cap.className = 'cap'; cap.textContent = t.name;
    b.appendChild(cap);
    b.onclick = () => selectTheme(idx);
    box.appendChild(b);
  });
}
function selectTheme(idx){
  theme = THEMES[idx];
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('on', i === idx));
  paintBackground();
  buildParticles();
}

function setStatus(msg){ $('#status').textContent = msg; }

$('#sens').oninput  = e => { sens = +e.target.value; $('#vSens').textContent = sens; };
$('#count').oninput = e => { wantCount = +e.target.value; $('#vCount').textContent = wantCount; buildParticles(); };
$('#wind').oninput  = e => { windScale = +e.target.value / 100; $('#vWind').textContent = e.target.value + '%'; };
$('#btnReset').onclick  = () => { calibrate = 45; setStatus('배경을 다시 학습합니다… 잠깐 비켜 주세요'); setTimeout(() => setStatus(camOn ? '카메라 작동 중' : '체험 모드'), 1600); };
$('#btnMirror').onclick = e => { mirror = !mirror; e.target.classList.toggle('on', mirror); calibrate = 30; };
$('#btnSil').onclick    = e => { showSil = !showSil; e.target.classList.toggle('on', showSil); };
$('#btnFull').onclick   = toggleFull;
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen?.().catch(() => {});
}
$('#btnSil').classList.toggle('on', showSil);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= String(THEMES.length)) selectTheme(+k - 1);
  else if (k === 'r') $('#btnReset').click();
  else if (k === 'f') toggleFull();
  else if (k === 'h'){ uiHidden = !uiHidden; document.body.classList.toggle('hidden-ui', uiHidden); }
});

// 카메라 없을 때의 포인터 상호작용
let lastPt = null;
function movePointer(x, y){
  const sp = lastPt ? clamp(Math.hypot(x - lastPt.x, y - lastPt.y) / 26, 0, 1) : 0;
  pointer = { x, y, speed: sp * .9 + .1 };
  lastPt = { x, y };
}
addEventListener('pointermove', e => { if (!camOn) movePointer(e.clientX, e.clientY); });
addEventListener('pointerleave', () => { if (!camOn) pointer = null; });

/* ---------- 시작 ---------- */
async function begin(useCam){
  $('#introNote').textContent = useCam ? '카메라를 여는 중…' : '';
  if (useCam){
    try {
      await startCamera();
      setStatus('카메라 작동 중 · 3초간 화면을 비워 주세요');
      setTimeout(() => setStatus('카메라 작동 중'), 3200);
    } catch (err){
      const name = err && err.name || 'Error';
      const guide = {
        NotAllowedError:  '브라우저가 카메라 사용을 막았습니다. 주소창 왼쪽의 카메라(또는 자물쇠) 아이콘을 눌러 "허용"으로 바꿔 주세요.',
        NotFoundError:    '연결된 카메라를 찾지 못했습니다. 웹캠이 꽂혀 있는지, 노트북 카메라 덮개가 열려 있는지 확인해 주세요.',
        NotReadableError: '다른 프로그램(줌·팀즈 등)이 카메라를 쓰고 있습니다. 그 프로그램을 끄고 다시 시도해 주세요.',
        SecurityError:    '이 브라우저는 파일을 직접 열었을 때 카메라를 막습니다.'
      }[name] || ('카메라를 열 수 없습니다 (' + name + ').');
      const extra = location.protocol === 'file:'
        ? ' 폴더 안의 "실행-윈도우.bat"(맥은 "실행-맥리눅스.command")으로 열면 대부분 해결됩니다.'
        : '';
      $('#introNote').textContent = guide + extra + ' 카메라 없이도 체험할 수 있습니다.';
      return;
    }
  } else {
    setStatus('체험 모드 · 마우스를 움직여 보세요');
  }
  $('#intro').classList.add('gone');
}
$('#btnStart').onclick = () => begin(true);
$('#btnDemo').onclick  = () => begin(false);

addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(resize, 180); });

// 초기화
$('#vSens').textContent  = sens;
$('#vCount').textContent = wantCount;
$('#vWind').textContent  = '100%';
buildThemeCards();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
